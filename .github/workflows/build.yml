name: Build HOLMES

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja

      - name: Build
        shell: msys2 {0}
        run: |
          cd build
          cmake --build .

      - name: Deploy Qt
        run: |
          cd build
          windeployqt *.exe

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: HOLMES-EXE
          path: build/
